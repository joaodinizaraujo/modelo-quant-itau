[project]
name = "modelo-quant"
version = "0.1.0"
description = "Client da Threads API e utilitario de analise de sentimento"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# pysentimiento arrasta torch (~2,5 GB). Fica opcional de proposito:
#   uv sync --extra sentiment
sentiment = ["pysentimiento>=0.7.3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelo_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
